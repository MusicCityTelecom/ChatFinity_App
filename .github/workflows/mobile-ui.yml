name: Mobile device UI checks
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Mobile preview builds]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["apps/mobile/.maestro/**", ".github/workflows/mobile-ui.yml"]
permissions:
  contents: read
  actions: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    outputs:
      android_run: ${{ steps.find.outputs.android_run }}
      ios_run: ${{ steps.find.outputs.ios_run }}
    steps:
      - uses: actions/github-script@v7
        id: find
        with:
          script: |
            const repo = context.repo;
            const runIds = context.eventName === 'workflow_run'
              ? [context.payload.workflow_run.id]
              : (await github.rest.actions.listWorkflowRuns({...repo, workflow_id:'mobile.yml', branch:'main', per_page:10})).data.workflow_runs.map(run=>run.id);
            let android = '', ios = '';
            for (const id of runIds) {
              const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({...repo,run_id:id})).data.artifacts.filter(a=>!a.expired);
              if (!android && artifacts.some(a=>a.name==='ChatFinity-Android-preview')) android=String(id);
              if (!ios && artifacts.some(a=>a.name==='ChatFinity-iPhone-simulator')) ios=String(id);
              if (android && ios) break;
            }
            core.setOutput('android_run',android);
            core.setOutput('ios_run',ios);
  android:
    needs: artifacts
    if: needs.artifacts.outputs.android_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: apps/mobile }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with:
          name: ChatFinity-Android-preview
          run-id: ${{ needs.artifacts.outputs.android_run }}
          github-token: ${{ github.token }}
          path: apps/mobile/build/android
      - name: Install native UI test runner
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and check Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apps/mobile/build/android/ChatFinity-android-preview.apk
            cd apps/mobile && "$HOME/.maestro/bin/maestro" test -e SCREENSHOT_DIR="$(pwd)/build" .maestro/smoke.yaml
      - name: Capture preview for review
        if: always()
        run: |
          python3 - <<'PY'
          import base64,pathlib
          p=pathlib.Path('build/ChatFinity-login.png')
          if p.exists():
            b=base64.b64encode(p.read_bytes()).decode()
            for i in range(0,len(b),8000): print('CHATFINITY_SCREENSHOT_PART:'+b[i:i+8000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatFinity-Android-UI-check
          path: |
            apps/mobile/build/*.png
            ~/.maestro/tests/
          retention-days: 14
  ios:
    needs: artifacts
    if: needs.artifacts.outputs.ios_run != ''
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run: { working-directory: apps/mobile }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with:
          name: ChatFinity-iPhone-simulator
          run-id: ${{ needs.artifacts.outputs.ios_run }}
          github-token: ${{ github.token }}
          path: apps/mobile/build/ios
      - name: Install native UI test runner
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
      - name: Launch and check iPhone screens
        run: |
          ditto -x -k build/ios/ChatFinity-iOS-simulator.zip build/ios
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for values in data["devices"].values() for d in values if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/ios/ChatFinityPreview.app
          "$HOME/.maestro/bin/maestro" --device "$DEVICE_ID" test -e SCREENSHOT_DIR="$(pwd)/build" .maestro/smoke.yaml
      - name: Capture preview for review
        if: always()
        run: |
          python3 - <<'PY'
          import base64,pathlib
          p=pathlib.Path('build/ChatFinity-login.png')
          if p.exists():
            b=base64.b64encode(p.read_bytes()).decode()
            for i in range(0,len(b),8000): print('CHATFINITY_SCREENSHOT_PART:'+b[i:i+8000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatFinity-iPhone-UI-check
          path: |
            apps/mobile/build/*.png
            ~/.maestro/tests/
          retention-days: 14
