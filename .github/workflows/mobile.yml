name: Mobile preview builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "!apps/mobile/.maestro/**"]
permissions:
  contents: read
jobs:
  validate:
    outputs:
      mobile_changed: ${{ steps.scope.outputs.mobile_changed }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: scope
        name: Determine native source scope
        env:
          PUSH_BASE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git diff --quiet "$PUSH_BASE" HEAD -- apps/mobile; then
            echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx expo export --platform android --output-dir .export/android --max-workers 2
      - run: npx expo export --platform ios --output-dir .export/ios --max-workers 2
  android:
    concurrency:
      group: mobile-android-${{ github.ref }}
      cancel-in-progress: true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Compile standalone preview APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        working-directory: apps/mobile/android
        env: { CI: "1" }
      - name: Package Android preview
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/ChatFinity-android-preview.apk
          sha256sum build/ChatFinity-android-preview.apk > build/SHA256SUMS
          printf '%s\n' 'Internal preview only. Uses a development signing key. Not a Google Play production release.' > build/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFinity-Android-preview
          path: apps/mobile/build/
          retention-days: 30
  ios:
    if: needs.validate.outputs.mobile_changed == 'true'
    concurrency:
      group: mobile-ios-${{ github.ref }}
      cancel-in-progress: true
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --repo-update
        working-directory: apps/mobile/ios
      - name: Compile iPhone simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/ChatFinityPreview.xcworkspace -scheme ChatFinityPreview -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual CODE_SIGN_ENTITLEMENTS="$(pwd)/ci/Simulator.entitlements" build | tee /tmp/chatfinity-ios-build.log | tail -80
        env: { CI: "1" }
      - name: Package simulator build
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/ChatFinityPreview.app build/ChatFinity-iOS-simulator.zip
          shasum -a 256 build/ChatFinity-iOS-simulator.zip > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFinity-iPhone-simulator
          path: |
            apps/mobile/build/ChatFinity-iOS-simulator.zip
            apps/mobile/build/SHA256SUMS
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ChatFinity-iOS-build-log
          path: /tmp/chatfinity-ios-build.log
          retention-days: 7
