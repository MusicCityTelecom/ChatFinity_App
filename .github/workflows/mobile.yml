name: Mobile preview builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/mobile.yml"]
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npm run typecheck
      - run: npx expo install --check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx expo export --platform android --output-dir .export/android --max-workers 2
      - run: npx expo export --platform ios --output-dir .export/ios --max-workers 2
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Compile standalone preview APK
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        working-directory: apps/mobile/android
        env: { CI: "1" }
      - name: Package Android preview
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk build/ChatFinity-android-preview.apk
          sha256sum build/ChatFinity-android-preview.apk > build/SHA256SUMS
          printf '%s\n' 'Internal preview only. Uses a development signing key. Not a Google Play production release.' > build/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFinity-Android-preview
          path: apps/mobile/build/
          retention-days: 30
      - name: Install native UI test runner
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and check native Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apps/mobile/build/ChatFinity-android-preview.apk
            cd apps/mobile && "$HOME/.maestro/bin/maestro" -e SCREENSHOT_DIR="$(pwd)/build" test .maestro/smoke.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatFinity-Android-UI-check
          path: |
            apps/mobile/build/*.png
            ~/.maestro/tests/
          retention-days: 14
  ios:
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --workspaces=false --no-audit --no-fund
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --repo-update
        working-directory: apps/mobile/ios
      - name: Compile iPhone simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/ChatFinityPreview.xcworkspace -scheme ChatFinityPreview -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build | tee /tmp/chatfinity-ios-build.log | tail -80
        env: { CI: "1" }
      - name: Package simulator build
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Release-iphonesimulator/ChatFinityPreview.app build/ChatFinity-iOS-simulator.zip
          shasum -a 256 build/ChatFinity-iOS-simulator.zip > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFinity-iPhone-simulator
          path: |
            apps/mobile/build/ChatFinity-iOS-simulator.zip
            apps/mobile/build/SHA256SUMS
          retention-days: 30
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install native UI test runner
        run: |
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
      - name: Launch and check native iPhone screens
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for values in data["devices"].values() for d in values if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/ios/Build/Products/Release-iphonesimulator/ChatFinityPreview.app
          "$HOME/.maestro/bin/maestro" --device "$DEVICE_ID" -e SCREENSHOT_DIR="$(pwd)/build" test .maestro/smoke.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ChatFinity-iPhone-UI-check
          path: |
            apps/mobile/build/*.png
            ~/.maestro/tests/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ChatFinity-iOS-build-log
          path: /tmp/chatfinity-ios-build.log
          retention-days: 7
