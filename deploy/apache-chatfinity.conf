# Install as a separate vhost through server2's existing Apache management process.
# Requires: proxy, proxy_http, proxy_wstunnel, headers, ssl; preserve existing SSL automation.
# This is an HTTPS template. Supply certificate paths issued for each actual hostname.
<VirtualHost *:443>
    ServerName chat.innaware.net
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/chat.innaware.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chat.innaware.net/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # Override client-controlled forwarding headers before passing requests to the app.
    RequestHeader unset X-Forwarded-For
    ProxyAddHeaders On
    ProxyPass /api/events ws://127.0.0.1:3080/api/events
    ProxyPassReverse /api/events ws://127.0.0.1:3080/api/events
    ProxyPass / http://127.0.0.1:3080/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3080/
    LimitRequestBody 23068672
    ErrorLog ${APACHE_LOG_DIR}/chatfinity-error.log
    # Do not log email verification/invitation tokens or meeting JWT query strings.
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" chatfinity_path_only
    CustomLog ${APACHE_LOG_DIR}/chatfinity-access.log chatfinity_path_only
</VirtualHost>
<VirtualHost *:443>
    ServerName meet.chat.innaware.net
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/meet.chat.innaware.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/meet.chat.innaware.net/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /rtc ws://127.0.0.1:7880/rtc
    ProxyPassReverse /rtc ws://127.0.0.1:7880/rtc
    ProxyPass / http://127.0.0.1:7880/ timeout=120
    ProxyPassReverse / http://127.0.0.1:7880/
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" chatfinity_path_only
    CustomLog ${APACHE_LOG_DIR}/chatfinity-meet-access.log chatfinity_path_only
    ErrorLog ${APACHE_LOG_DIR}/chatfinity-meet-error.log
</VirtualHost>
