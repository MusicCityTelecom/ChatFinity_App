# Alternative HTTPS template if the host is migrated to Nginx.
# Certificate provisioning and HTTP redirects belong to the host's existing configuration.
server {
    listen 443 ssl;
    server_name chat.innaware.net;
    ssl_certificate /etc/letsencrypt/live/chat.innaware.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.innaware.net/privkey.pem;
    client_max_body_size 22m;
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
server {
    listen 443 ssl;
    server_name meet.chat.innaware.net;
    ssl_certificate /etc/letsencrypt/live/meet.chat.innaware.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.chat.innaware.net/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
