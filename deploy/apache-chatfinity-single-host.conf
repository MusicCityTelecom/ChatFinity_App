# Server2: web and meeting signaling share chat.innaware.net.
# Requires Apache 2.4.47+ with proxy_http, proxy_wstunnel, rewrite, headers and ssl.
<VirtualHost *:80>
    ServerName chat.innaware.net
    DocumentRoot /var/www/chatfinity-acme
    <Directory /var/www/chatfinity-acme>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://chat.innaware.net%{REQUEST_URI} [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/chatfinity-error.log
    CustomLog ${APACHE_LOG_DIR}/chatfinity-access.log combined
</VirtualHost>
<VirtualHost *:443>
    ServerName chat.innaware.net
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/chat.innaware.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chat.innaware.net/privkey.pem
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-For
    ProxyAddHeaders On
    ProxyTimeout 120
    # More specific paths must come before the main application proxy.
    ProxyPass /media/ http://127.0.0.1:7880/ upgrade=websocket
    ProxyPassReverse /media/ http://127.0.0.1:7880/
    ProxyPass / http://127.0.0.1:3080/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:3080/
    LimitRequestBody 23068672
    ErrorLog ${APACHE_LOG_DIR}/chatfinity-error.log
    CustomLog ${APACHE_LOG_DIR}/chatfinity-access.log combined
</VirtualHost>
