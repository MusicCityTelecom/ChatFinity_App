appId: net.innaware.chatfinity.preview
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Email address"
    timeout: 30000
- assertVisible: "Password"
- takeScreenshot: ChatFinity-login
- scrollUntilVisible:
    element: "New here.*Create an account"
    direction: DOWN
- tapOn: "New here.*Create an account"
- assertVisible: "Your name"
- scrollUntilVisible:
    element: "Organization ID.*optional.*"
    direction: DOWN
- assertVisible: "Organization ID.*optional.*"
- takeScreenshot: ChatFinity-signup
- scrollUntilVisible:
    element: "Back to sign in"
    direction: DOWN
- tapOn: "Back to sign in"
- scrollUntilVisible:
    element: "Forgot your password.*"
    direction: DOWN
- tapOn: "Forgot your password.*"
- assertVisible: "Send reset link.*"
- takeScreenshot: ChatFinity-recovery
- tapOn: "Back to sign in"
- assertVisible: "Password"
