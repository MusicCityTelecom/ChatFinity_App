<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'sha256-m9KIjM/3f4D+ghhmU4SlLwNQIq5mAVcDxtdlARkS02w=';"
    />
    <title>Connect to ChatFinity</title>
    <style>
      body {
        margin: 0;
        background: #103e43;
        color: #dce9d2;
        font: 15px/1.7 system-ui;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        padding: 45px;
        width: min(480px, 80vw);
      }
      .logo {
        font-size: 25px;
        font-weight: 650;
        color: #d8e9bb;
      }
      h1 {
        font-size: 35px;
        line-height: 1.2;
        letter-spacing: -1.5px;
        font-weight: 500;
      }
      p {
        color: #a1bdb0;
        font-size: 14px;
      }
      form {
        margin-top: 32px;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 8px;
      }
      input {
        box-sizing: border-box;
        padding: 14px 15px;
        width: 100%;
        font: inherit;
        color: #163f36;
        background: #f6f9ef;
        border: 0;
        border-radius: 8px;
      }
      button {
        display: block;
        margin-top: 15px;
        width: 100%;
        padding: 14px;
        font: 600 14px system-ui;
        background: #bed69c;
        color: #173c2f;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      small {
        font-size: 11px;
        color: #849e8f;
        display: block;
        margin-top: 30px;
      }
      #error {
        font-size: 13px;
        color: #ffb5a4;
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #7db89f;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">◌ ChatFinity.</div>
      <h1>Your people.<br />One connection away.</h1>
      <p>
        Connect to your organization’s ChatFinity server. Your administrator can
        share the address with you.
      </p>
      <form id="connect">
        <label for="url">Server address</label
        ><input
          id="url"
          type="url"
          value="https://chat.innaware.net"
          placeholder="https://chat.innaware.net"
          required
        /><button id="submit">Connect to ChatFinity →</button>
        <p id="error" role="alert"></p>
      </form>
      <small
        >Your server connection uses HTTPS. Sign in or create an account after
        connecting. You can switch servers from the ChatFinity menu.</small
      >
    </div>
    <script>
      document
        .getElementById("connect")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const button = document.getElementById("submit");
          button.disabled = true;
          try {
            const result = await window.chatfinitySetup.connect(
              document.getElementById("url").value.trim(),
            );
            if (result.error)
              document.getElementById("error").textContent = result.error;
          } catch {
            document.getElementById("error").textContent =
              "Could not connect. Check the server address.";
          } finally {
            button.disabled = false;
          }
        });
    </script>
  </body>
</html>
