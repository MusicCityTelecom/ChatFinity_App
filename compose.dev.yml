name: chatfinity-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chatfinity
      POSTGRES_USER: chatfinity
      POSTGRES_PASSWORD: chatfinity
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["dev_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatfinity"]
      interval: 3s
      retries: 15
  mail:
    image: axllent/mailpit:v1.32.0
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      ["127.0.0.1:7880:7880", "127.0.0.1:7881:7881", "127.0.0.1:7882:7882/udp"]
volumes:
  dev_postgres:
